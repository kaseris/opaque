[project]
name = "opaque"
version = "0.1.0"
description = "Project-agnostic LLM evaluation tracking tool (classification & structured extraction), built on MLflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlflow>=2.16",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.30",
  "pytest-cov>=7.1.0",
]

[project.scripts]
opaque = "opaque.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opaque"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
